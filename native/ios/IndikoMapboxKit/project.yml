name: IndikoMapboxKit
options:
  bundleIdPrefix: ch.indiko
  deploymentTarget:
    iOS: "14.2"
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.26.0
targets:
  IndikoMapboxKit:
    type: framework
    platform: iOS
    sources:
      - Sources/IndikoMapboxKit
    dependencies:
      - package: MapboxMaps
    settings:
      base:
        # Only the generated ObjC header is consumed by the .NET binding,
        # so full library evolution (BUILD_LIBRARY_FOR_DISTRIBUTION) is not required.
        BUILD_LIBRARY_FOR_DISTRIBUTION: "NO"
        SKIP_INSTALL: "NO"
        DEFINES_MODULE: "YES"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: ch.indiko.IndikoMapboxKit
